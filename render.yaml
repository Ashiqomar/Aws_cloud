# ──────────────────────────────────────────────
# Render Infrastructure as Code (Blueprint Specification)
# ──────────────────────────────────────────────
services:

  # 1. FastAPI Backend Web Service
  - type: web
    name: finops-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m migrations.create_tables && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: FinOps Cloud Cost Optimizer
      - key: DEBUG
        value: "false"
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: GEMINI_API_KEY
        sync: false

  # 2. React Frontend Static Site
  - type: web
    name: finops-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
